name: Simulator UI Extended

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: simulator-ui-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-simulator-ui:
    name: Extended simulator UI (hosted-safe)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prepare hosted macOS toolchain
        run: ./scripts/prepare_github_hosted_ci_macos.sh
      - name: Run extended hosted-safe simulator suite
        run: HEAVY_IOS_RESULT_BUNDLE_PATH="$RUNNER_TEMP/ios-hosted-extended.xcresult" ./scripts/verify_github_hosted_ci.sh heavy-ios
      - name: Upload extended simulator result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-hosted-extended-xcresult
          path: ${{ runner.temp }}/ios-hosted-extended.xcresult
          if-no-files-found: warn
          retention-days: 7
