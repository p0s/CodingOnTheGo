name: CodingOnTheGoCompanion
options:
  createIntermediateGroups: true
packages:
  SharedModels:
    path: ../../../Packages/SharedModels
  CompanionHost:
    path: ../../../Packages/CompanionHost
  HostBootstrap:
    path: ../../../Packages/HostBootstrap
  Persistence:
    path: ../../../Packages/Persistence
  Notifications:
    path: ../../../Packages/Notifications
targets:
  CodingOnTheGoCompanion:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/CompanionApp
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codingonthego.companion
        PRODUCT_NAME: Coding On The Go Companion
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.9.0
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        INFOPLIST_KEY_CFBundleDisplayName: Coding On The Go Companion
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
        Release:
          CODE_SIGN_ENTITLEMENTS: CodingOnTheGoCompanion.entitlements
    dependencies:
      - package: SharedModels
      - package: CompanionHost
      - package: HostBootstrap
      - package: Persistence
      - package: Notifications
  CodingOnTheGoCompanionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/CodingOnTheGoCompanionTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: CompanionHost
schemes:
  CodingOnTheGoCompanion:
    build:
      targets:
        CodingOnTheGoCompanion: all
        CodingOnTheGoCompanionTests: [test]
    test:
      targets:
        - name: CodingOnTheGoCompanionTests
